#should not place spring.** properties here (won't be applied even if placed)
server.port=1669
eureka.client.serviceUrl.defaultZone=http://localhost:3161/eureka/
##/*30 days*/
userPasswordSubsequentResetTime = 30
userPassword.matchPercentage=0.50
app.userExpiry = 3600000
# Log levels
logging.level.root=INFO
logging.level.com.yourpackage=DEBUG

# Log file configurations
logging.file.name=logs/prime360_gateway.log
logging.file.max-size=10MB
logging.file.max-history=60

doPortValidation=true
cors.origin=http://localhost:1669
#ssl.expectct.max.age=86400000
app.token_expiry=3600000
# Console log pattern
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# File log pattern
logging.pattern.file=%d %p %c{1} [%t] %m%n