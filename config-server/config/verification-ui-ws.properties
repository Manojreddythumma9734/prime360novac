LOSMATCHQUERY=INSERT INTO LOS_INPUT_FROMPSX(LSI_APP_ID_C,LSI_CUST_ID_N,LSI_STATUS_C,LSI_CUST_TYPE_C,LSI_CUST_EXPOSURE_N,LSI_DEDUPE_DATE,LSI_BORROWER_F,LSI_PRODUCTCODE_C,LSI_SOURCE_C,LSI_FILE_NAME_C,LSI_CREDITCARDNO_C,LSI_CURRENT_OUTSTANDING_N,LSI_CUSTOMER_TYPE_C,LSI_DOB_D,LSI_DAYS_OVERLINE_CURRENT_N,LSI_DAYS_OVERLINE_YTD_N,LSI_DAYS_PAST_DUE_N,LSI_DEDUPE_CATEGORY_C,LSI_DELINQUENCY_STRING_C,LSI_DISBURSEMENT_DATE_D,LSI_DRIVINGLICNO_C,LSI_EMPLOYER_NAME_C,LSI_FW_ACCOUNT_NUMBER_C,LSI_FW_CUSTOMERID_N,LSI_LOAN_AMT_N,LSI_LOAN_STATUS_C,LSI_MOBILENO_C,LSI_NPA_STAGE_ID_C,LSI_OBC_CARD_C,LSI_OFF_ADDRESS_C,LSI_OFF_CITY_C,LSI_OFF_PHONE1_C,LSI_OFF_ZIP_C,LSI_OVERDRAFT_COLLATERAL_DTL_C,LSI_OVERDRAFT_LIMIT_NO_C,LSI_PAN_C,LSI_PASSPORTNO_C,LSI_RES_ADDRESS_C,LSI_RES_CITY_C,LSI_RES_PHONE1_C,LSI_RES_ZIP_C,LSI_SAS_ID_N,LSI_TOTAL_EXPOSURE_N,LSI_VOTER_ID_C,LSI_SAS_UPDATE_STATUS,LSI_SAS_UPDATE_DATE, 	LSI_REMARKS_C,LSI_MATCH_APPID_C,LSI_FNAME_C,LSI_MNAME_C,LSI_LNAME_C   ) SELECT ?,? ,  'Match',   CASE WHEN ENTITYTYPE='NEG' THEN 'B' else DECODE(REMARKS,'GOOD','G','BAD','B','REJECT','R') end LSI_CUST_TYPE_C,   substr(TOTAL_AMOUNT_DUE,1,18) LSI_CUST_EXPOSURE_N,   ?,   ?,   Product_code,  ENTITYTYPE,?,   EXTRA_EQ_COLUMN4,   CURRENT_OUTSTANDING,   CASE WHEN ENTITYTYPE='NEG' THEN 'Bad' else DECODE(REMARKS,'GOOD','Good','BAD','Bad','REJECT','Reject')  end LSI_CUSTOMER_TYPE_C,   BIRTHDATE,   DAYS_OVERLINE_CURRENT,   DAYS_OVERLINE_YTD,   DAYS_PAST_DUE,   RA_HA_TESTe_category,   SUBSTR(DELIQUENCYREASON,1,60),   null,   LICENSEID,   SUBSTR(EXTRA_NAME_1,1,50) EXTRA_NAME_1,   EXTRA_EQ_COLUMN7,   EXTRA_EQ_COLUMN8,   LOANAMOUNT,   LOAN_STATUS,   PHONE2,   STAGE_ID,   EXTRA_EQ_COLUMN3,   ADDRESSLINE1,   CITY1,   PHONE1,   ZIPCODE1,   OVERDRAFTCOLLATERALDETAILS,   OVERDRAFTLIMITNO,   TAXID,   PASSPORTID,   ADDRESSLINE,   CITY,   PHONE,  ZIPCODE,   EXTRA_EQ_COLUMN8,   sum(TOTAL_AMOUNT_DUE) over(partition by REQUESTID order by REQUESTID),VOTER_ID,'Y',SYSTIMESTAMP,REMARKS,CUSTOMERID,SUBSTR(FIRSTNAME,1,100),substr(MIDDLENAME,1,30),SUBSTR(LASTNAME,1,30) FROM REPORT_INPUT_OUTPUT WHERE REQUESTID=? AND RECORD_TYPE!='INPUT' AND accept_reject IN ('SM','M')
LOSNOMATCHQUERY=insert into LOS_INPUT_FROMPSX(LSI_APP_ID_C,LSI_STATUS_C,LSI_BORROWER_F,LSI_FILE_NAME_C,LSI_SAS_UPDATE_STATUS,LSI_SAS_UPDATE_DATE,LSI_SOURCE_C,LSI_FNAME_C) SELECT CUSTIDPART2,'No Match',BORROWER_FLAG,file_unique_number,'Y',SYSTIMESTAMP,ENTITYTYPE,NAME FROM REPORT_INPUT_OUTPUT WHERE REQUESTID=? AND RECORD_TYPE='INPUT' and pos_match_count=?
SASMATCHQUERY=INSERT INTO LOS_INPUT_FROMPSX   (LSI_APP_ID_C,LSI_CUST_ID_N,LSI_STATUS_C,LSI_CUST_TYPE_C,LSI_CUST_EXPOSURE_N,LSI_DEDUPE_DATE,LSI_BORROWER_F,LSI_PRODUCTCODE_C,LSI_SOURCE_C,LSI_FNAME_C,LSI_FILE_NAME_C,LSI_CREDITCARDNO_C,LSI_CURRENT_OUTSTANDING_N,LSI_CUSTOMER_TYPE_C,LSI_DOB_D,LSI_DAYS_OVERLINE_CURRENT_N,LSI_DAYS_OVERLINE_YTD_N,LSI_DAYS_PAST_DUE_N,LSI_DEDUPE_CATEGORY_C,LSI_DELINQUENCY_STRING_C,LSI_DISBURSEMENT_DATE_D,LSI_DRIVINGLICNO_C,LSI_EMPLOYER_NAME_C,LSI_FW_ACCOUNT_NUMBER_C,LSI_FW_CUSTOMERID_N,LSI_LOAN_AMT_N,LSI_LOAN_STATUS_C,LSI_MOBILENO_C,LSI_NPA_STAGE_ID_C,LSI_OBC_CARD_C,LSI_OFF_ADDRESS_C,LSI_OFF_CITY_C,LSI_OFF_PHONE1_C,LSI_OFF_ZIP_C,LSI_OVERDRAFT_COLLATERAL_DTL_C,LSI_OVERDRAFT_LIMIT_NO_C,LSI_PAN_C,LSI_PASSPORTNO_C,LSI_RES_ADDRESS_C,LSI_RES_CITY_C,LSI_RES_PHONE1_C,LSI_RES_ZIP_C,LSI_SAS_ID_N,LSI_TOTAL_EXPOSURE_N,LSI_VOTER_ID_C,LSI_SAS_UPDATE_STATUS,LSI_SAS_UPDATE_DATE, 	LSI_REMARKS_C,LSI_MATCH_APPID_C   ) SELECT ?,?,   'SAS',   CASE WHEN ENTITYTYPE='NEG' THEN 'B' else DECODE(REMARKS,'GOOD','G','BAD','B','REJECT','R') end LSI_CUST_TYPE_C,   CUST_EXPOSURE LSI_CUST_EXPOSURE_N,   ?,   A.FLAG1,   A.PRODUCT_FLAG,   A.ENTITY_FLAG,   A.NAME,   ?,   A.EXTRA_EQ_COLUMN4,   REPORT.CURRENT_OUTSTANDING,   CASE WHEN ENTITYTYPE='NEG' THEN 'Bad' else DECODE(REMARKS,'GOOD','Good','BAD','Bad','REJECT','Reject')  end LSI_CUSTOMER_TYPE_C,   A.DOB,   REPORT.DAYS_OVERLINE_CURRENT,   REPORT.DAYS_OVERLINE_YTD,   REPORT.DAYS_PAST_DUE,   REPORT.DEDUPE_CATEGORY,   REPORT.DELINQUENCY_STRING,   REPORT.DISBURSEMENT_DATE,   A.DRIVING_LICN_NO,   SUBSTR(a.EXTRA_NAME_1,1,50) EXTRA_NAME_1,   A.EXTRA_EQ_COLUMN7,   A.EXTRA_EQ_COLUMN8,   REPORT.LOAN_AMT_APPLIED,   REPORT.LOAN_STATUS,   CONTACT.PHONE3,   REPORT.NPA_STAGE_ID,   a.extra_eq_column3,   ADDR.ADDR2,   ADDR.CITY2,   CONTACT.PHONE2,   ADDR.PINCODE2,   report.overdraft_collateral_dtl,   report.overdraft_limit_no,   a.pan,   a.passport_no,   ADDR.ADDR1,   ADDR.CITY1,   CONTACT.PHONE1,   ADDR.PINCODE1,   A.EXTRA_EQ_COLUMN8,   REPORT.TOTAL_EXPOSURE,   A.VOTERID,   'Y',   SYSTIMESTAMP,   REPORT.REMARKS,a.cust_id FROM PSX_CUST_DG_BULK_TRG_T A ,   (SELECT PSX_ID,MAX(ADDR1) ADDR1,MAX(ADDR2) ADDR2,MAX(ADDR3) ADDR3,MAX(ADDR4) ADDR4,MAX(ADDR5) ADDR5,MAX(CITY1) CITY1,MAX(CITY2) CITY2,MAX(CITY3) CITY3,MAX(CITY4) CITY4,MAX(CITY5) CITY5,MAX(PINCODE1) PINCODE1,MAX(PINCODE2) PINCODE2,MAX(PINCODE3) PINCODE3,MAX(PINCODE4) PINCODE4,MAX(PINCODE5) PINCODE5,MAX(STATE1) STATE1,MAX(STATE2) STATE2,MAX(STATE3) STATE3,MAX(STATE4) STATE4,MAX(STATE5) STATE5   FROM (SELECT PSX_ID,  CASE    WHEN ADDRESS_TYPE_FLAG='resaddr'    THEN TRIM(ADDRESS ||' ' ||LANDMARK)  END ADDR1,  CASE    WHEN ADDRESS_TYPE_FLAG='offaddr'    THEN TRIM(ADDRESS ||' ' ||LANDMARK)  END ADDR2,  CASE    WHEN ADDRESS_TYPE_FLAG='mailingaddr'    THEN TRIM(ADDRESS ||' ' ||LANDMARK)  END ADDR3,  CASE    WHEN ADDRESS_TYPE_FLAG='ADDR4'    THEN TRIM(ADDRESS ||' ' ||LANDMARK)  END ADDR4,  CASE    WHEN ADDRESS_TYPE_FLAG='ADDR5'    THEN TRIM(ADDRESS ||' ' ||LANDMARK)  END ADDR5,  CASE    WHEN ADDRESS_TYPE_FLAG='resaddr'    THEN CITY  END CITY1,  CASE    WHEN ADDRESS_TYPE_FLAG='offaddr'    THEN CITY  END CITY2,  CASE    WHEN ADDRESS_TYPE_FLAG='mailingaddr'    THEN CITY  END CITY3,  CASE    WHEN ADDRESS_TYPE_FLAG='ADDR4'    THEN CITY  END CITY4,  CASE    WHEN ADDRESS_TYPE_FLAG='ADDR5'    THEN CITY  END CITY5,  CASE    WHEN ADDRESS_TYPE_FLAG='resaddr'    THEN PINCODE  END PINCODE1,  CASE    WHEN ADDRESS_TYPE_FLAG='offaddr'    THEN PINCODE  END PINCODE2,  CASE    WHEN ADDRESS_TYPE_FLAG='mailingaddr'    THEN PINCODE  END PINCODE3,  CASE    WHEN ADDRESS_TYPE_FLAG='ADDR4'    THEN PINCODE  END PINCODE4,  CASE    WHEN ADDRESS_TYPE_FLAG='ADDR5'    THEN PINCODE  END PINCODE5,  CASE    WHEN ADDRESS_TYPE_FLAG='resaddr'    THEN STATE  END STATE1,  CASE    WHEN ADDRESS_TYPE_FLAG='offaddr'    THEN STATE  END STATE2,  CASE    WHEN ADDRESS_TYPE_FLAG='mailingaddr'    THEN STATE  END STATE3,  CASE    WHEN ADDRESS_TYPE_FLAG='ADDR4'    THEN STATE  END STATE4,  CASE    WHEN ADDRESS_TYPE_FLAG='ADDR5'    THEN STATE  END STATE5 FROM PSX_CUST_ADDR_BULK_TRG_T where A.PSX_ID   IN   (SELECT PSX_ID   FROM PSX_CUST_DG_BULK_TRG_T A   WHERE EXTRA_EQ_COLUMN8 IN(SELECT EXTRA_EQ_COLUMN8 FROM REPORT_INPUT_OUTPUT B WHERE REQUESTID=?)   MINUS   SELECT PSX_ID FROM REPORT_INPUT_OUTPUT B WHERE REQUESTID=?)) A   GROUP BY PSX_ID   ) ADDR ,   (SELECT PSX_ID,MAX(PHONE1) PHONE1,MAX(PHONE2) PHONE2,MAX(PHONE3) PHONE3,MAX(PHONE4) PHONE4,MAX(PHONE5) PHONE5   FROM(SELECT PSX_ID,  CASE  WHEN PHONE_TYPE='resphone'    THEN PHONE  END PHONE1,  CASE    WHEN PHONE_TYPE='offphone'    THEN PHONE  END PHONE2,  CASE    WHEN PHONE_TYPE='mobile'    THEN PHONE  END PHONE3,  CASE    WHEN PHONE_TYPE='PHONE4'    THEN PHONE  END PHONE4,  CASE    WHEN PHONE_TYPE='PHONE5'    THEN PHONE  END PHONE5 FROM PSX_CUST_CONTACT_BULK_TRG_T where A.PSX_ID   IN   (SELECT PSX_ID   FROM PSX_CUST_DG_BULK_TRG_T A   WHERE EXTRA_EQ_COLUMN8 IN(SELECT EXTRA_EQ_COLUMN8 FROM REPORT_INPUT_OUTPUT B WHERE REQUESTID=?)   MINUS   SELECT PSX_ID FROM REPORT_INPUT_OUTPUT B WHERE REQUESTID=?))   GROUP BY PSX_ID   ) CONTACT ,   (SELECT PSX_ID,MAX(EMAIL_ID1) EMAIL_ID1,MAX(EMAIL_ID2) EMAIL_ID2,MAX(EMAIL_ID3) EMAIL_ID3,MAX(EMAIL_ID4) EMAIL_ID4,MAX(EMAIL_ID5) EMAIL_ID5   FROM(SELECT PSX_ID,  CASE    WHEN EMAIL_TYPE='EMAIL1'    THEN EMAIL_ID  END EMAIL_ID1,  CASE    WHEN EMAIL_TYPE='EMAIL2'    THEN EMAIL_ID  END EMAIL_ID2,  CASE    WHEN EMAIL_TYPE='EMAIL3'    THEN EMAIL_ID  END EMAIL_ID3,  CASE    WHEN EMAIL_TYPE='EMAIL4'    THEN EMAIL_ID  END EMAIL_ID4,  CASE    WHEN EMAIL_TYPE='EMAIL5'    THEN EMAIL_ID  END EMAIL_ID5 FROM PSX_CUST_EMAIL_BULK_TRG_T where A.PSX_ID   IN   (SELECT PSX_ID   FROM PSX_CUST_DG_BULK_TRG_T A   WHERE EXTRA_EQ_COLUMN8 IN(SELECT EXTRA_EQ_COLUMN8 FROM REPORT_INPUT_OUTPUT B WHERE REQUESTID=?)   MINUS   SELECT PSX_ID FROM REPORT_INPUT_OUTPUT B WHERE REQUESTID=?) )   GROUP BY PSX_ID   ) EMAIL,   PSX_CUST_REPORT_BULK_TRG_T REPORT WHERE (A.PSX_ID =ADDR.PSX_ID(+)) AND (A.PSX_ID   =CONTACT.PSX_ID(+)) AND (A.PSX_ID   =EMAIL.PSX_ID(+)) AND (A.PSX_ID   =REPORT.PSX_ID(+)) AND A.PSX_ID   IN   (SELECT PSX_ID   FROM PSX_CUST_DG_BULK_TRG_T A   WHERE EXTRA_EQ_COLUMN8 IN(SELECT EXTRA_EQ_COLUMN8 FROM REPORT_INPUT_OUTPUT B WHERE REQUESTID=?)   MINUS   SELECT PSX_ID FROM REPORT_INPUT_OUTPUT B WHERE REQUESTID=?)

