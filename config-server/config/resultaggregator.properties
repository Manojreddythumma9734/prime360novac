postDML.1=update psx_request set good_count=(select count(distinct cust_unq_id) as cnt from psx_report_input_output_customer where upper(scale_type)='CLASSIFICATION_GOOD' and request_id=?),REFFERAL_count=(select count(distinct cust_unq_id) as cnt from psx_report_input_output_customer where upper(scale_type) in('CLASSIFICATION_REFERRAL','CLASSIFICATION_AVERAGE') and request_id=?),bad_count=0 where request_id=?
postDML.2=update psx_request set MATCH_COUNT=GOOD_COUNT+refferal_count  where request_id=?
postDML.3=select psx_batch_id from psx_request where request_id=?
postDML.4=CALL pm_src_trg_link_single(?, ?)
#postDML.5=UPDATE PSX_REQUEST SET processed_time=current_timestamp,pos_req_status='C' WHERE REQUEST_ID=?
postDML.5=UPDATE PSX_REQUEST SET processed_time=?,end_to_end_time_millis= extract (EPOCH from (?-pos_start_time)::time) * 1000,pos_req_status='C' WHERE REQUEST_ID=?
postDML.6=UPDATE PSX_REQUEST SET processed_time=?,end_to_end_time_millis= extract (EPOCH from (?-pos_start_time)::time) * 1000,pos_req_status='E' WHERE REQUEST_ID=?


