# Port used when deploying the application as a WAR file on an external Tomcat server
server.port=8443
# Uncomment the below line to use this port when running the application as a JAR
# server.port=2478
# Logger Path
logger.homefolder=logs
# Log Levels
logging.level.root=INFO
logging.level.com.posidex.*=DEBUG
server.servlet.contextPath=/automerge

# Log file configurations
logging.file.name=logs/autoMerge.html
logging.file.max-size=10MB
logging.file.max-history=60

# Console log pattern
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# File log pattern
logging.pattern.file=%d %p %c{1} [%t] %m%n
