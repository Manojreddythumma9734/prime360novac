AdminUserCreationReportQuery=SELECT to_char(b.created_on,'yyyy-MM-dd hh24:mi:ss') as created_on,b.location_name,a.activity_username,  b.username,  A.UM_USERNAME,  a.activity_apr_by,  b.created_by, b.updated_by,  b.deleted_by,  a.activity,to_char(a.activity_date,'yyyy-MM-dd hh24:mi:ss') as   activity_date,  B.USER_ROLE , to_char(a.activity_apr_on,'yyyy-MM-dd hh24:mi:ss') as  activity_apr_on,  b.location_code,b.location_name,  a.username AS activity_user_name,a.user_old_profile,a.user_new_profile,a.new_emp_name,a.old_emp_name,a.new_location_code,a.old_location_code,a.old_email,a.new_email,a.old_mobile,a.new_mobile,a.old_job_title,a.new_job_title,a.old_supervisor_code,a.new_supervisor_code,a.old_dept_code,a.new_dept_code,a.old_dept_name,a.new_dept_name , a.old_user_category,a.new_user_category,to_char(a.old_expiry_date,'yyyy-MM-dd') as old_expiry_date,to_char(a.new_expiry_date,'yyyy-MM-dd') as  new_expiry_date,a.old_location_name,a.new_location_name FROM um_user b,(SELECT DISTINCT b.user_id,    b.activity_username,    b.username,    b.activity,    B.ACTIVITY_DATE, B.UM_USERNAME,    B.ACTIVITY_APR_BY,    b.ACTIVity_apr_on, b.user_old_profile,b.user_new_profile,b.new_emp_name,b.old_emp_name,b.new_location_code,b.old_location_code,b.old_email,b.new_email,b.old_mobile, b.new_mobile,b.old_job_title,b.new_job_title,b.old_supervisor_code,b.new_supervisor_code,b.old_dept_code,b.new_dept_code,b.old_dept_name,b.new_dept_name, b.old_user_category,b.new_user_category,b.old_expiry_date,b.new_expiry_date,b.old_location_name,b.new_location_name FROM um_user a,    um_user_activity b  WHERE b.is_rejected is null and a.user_id=b.user_id ) a WHERE A.ACTIVITY_USERNAME =B.USERNAME AND a.ACTIVITY_APR_ON BETWEEN to_timestamp(?,'dd-mm-yyyy hh24:mi:ss') AND to_timestamp(?,'dd-mm-yyyy hh24:mi:ss') order by ACTIVITY_APR_ON desc

