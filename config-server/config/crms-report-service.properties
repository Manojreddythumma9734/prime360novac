uiReferralMatchTatReportQuery=select requestid, dedupe_type, entitytype, accept_reject, TO_CHAR(pos_request_time, 'DD-MM-YYYY HH24:MI:SS') as pos_request_time, TO_CHAR(pos_response_time, 'DD-MM-YYYY HH24:MI:SS') as pos_response_time, TO_CHAR(client_report_time, 'DD-MM-YYYY HH24:MI:SS') as client_report_time, record_assigned_time, record_displayed_time, ROUND(extract(EPOCH from pos_response_time - pos_request_time) / 60, 1) as posidex_decision_tat, ROUND(extract(EPOCH from record_assigned_time - pos_response_time) / 60, 1) as allocation_of_queue_tat, ROUND(extract(EPOCH from record_displayed_time - record_assigned_time) / 60, 1) as actual_allocation_to_user_tat, ROUND(extract(EPOCH from client_report_time - verified_time) / 60, 1) as posidex_communication_tat_to_los, ROUND(extract(EPOCH from record_displayed_time - pos_request_time) / 60, 1) + ROUND(extract(EPOCH from client_report_time - verified_time) / 60, 1) as overall_system_tat, ROUND(extract(EPOCH from verified_time - record_displayed_time) / 60, 1) as user_tat, ROUND(extract(EPOCH from client_report_time - pos_request_time) / 60, 1) as end2end_tat from report_input_output where record_type = 'INPUT' and (accept_reject is null or accept_reject in ('MATCH', 'NOMATCH')) and pos_request_time between to_date(?, 'dd-MM-yyyy HH24:mi:ss') and to_date(?, 'dd-MM-yyyy HH24:mi:ss')
uiDirectMatchTatReportQuery=select requestid, dedupe_type, entitytype, accept_reject, TO_CHAR(pos_request_time, 'DD-MM-YYYY HH24:MI:SS') as pos_request_time, TO_CHAR(pos_response_time, 'DD-MM-YYYY HH24:MI:SS') as pos_response_time, TO_CHAR(client_report_time, 'DD-MM-YYYY HH24:MI:SS') as client_report_time, ROUND(extract(EPOCH from pos_response_time - pos_request_time) / 60, 1) as systemTAT from report_input_output where record_type = 'INPUT' and accept_reject in ('SYSTEM MATCH', 'SYSTEM NOMATCH') and pos_request_time between to_date(?, 'dd-MM-yyyy HH24:mi:ss') and to_date(?, 'dd-MM-yyyy HH24:mi:ss')


