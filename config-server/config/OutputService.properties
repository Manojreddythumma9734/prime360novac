server.port = 9001

server.servlet.context-path=/os

enableAutocommit=true


allRestSrcSystemEndpoints=select DATA_SOURCE_NAME src_system,endpoint from md_templates where UPPER(INTEGRATION_TYPE)='NEW_WEBSERVICE'
requestStatusQuery=Select is_verified from report_input_output where upper(file_unique_number)=? and upper(custidpart4)=? and record_type='INPUT'
getInputReqDetails=SELECT requestid, POS_MATCH_TYPE, FILE_UNIQUE_NUMBER, CUSTIDPART2, POS_RESPONSE_TIME, TO_CHAR(POS_REQUEST_TIME,'yyyy-mm-dd hh24:mi:ss.ff1') POS_REQUEST_TIME, POS_MATCH_COUNT, CUSTOMERID, ACCEPT_REJECT, FIRSTNAME, MIDDLENAME, LASTNAME, BORROWER_FLAG, TO_CHAR(CURRENT_TIMESTAMP,'yyyy-mm-dd hh24:mi:ss.ff1') AS SAS_UPDATE_DATE, CUSTOMERUNIQUEID, POS_MATCH_REASON, CASE WHEN VERIFIEDBY=0 THEN 'SYS' WHEN VERIFIEDBY=-1 THEN 'PSX_ROBO' ELSE (SELECT um.username FROM um_user um WHERE um.user_id=VERIFIEDBY ) END VERIFIEDBY FROM REPORT_INPUT_OUTPUT WHERE RECORD_TYPE ='INPUT' AND upper(ENTITYTYPE) =? AND UPPER(file_unique_number)=?
updateClientPushTime=UPDATE REPORT_INPUT_OUTPUT SET PUSH_START_TIME=CURRENT_TIMESTAMP WHERE RECORD_TYPE='INPUT' AND REQUESTID=?
deleteMatchedPsxIdsFromTemp=DELETE FROM SOA_PUSH_TEMP WHERE REQUEST_ID=?
#insertMatchedAdditioanlPsxIdsIntoTemp=INSERT INTO soa_push_temp (request_id, matched_cust_unq_id, accept_reject) SELECT ? AS request_id, subquery.customeruniqueid, STRING_AGG(subquery.accept_reject, ', ') AS accept_reject FROM ( SELECT DISTINCT customeruniqueid, 'MATCH' AS accept_reject FROM report_input_output WHERE requestid = ? AND record_type != 'INPUT' AND accept_reject IN ('SM', 'M') UNION ALL SELECT cust_unq_id AS customeruniqueid, 'UCIC' AS accept_reject FROM ( SELECT cust_unq_id FROM psx_cust_dg_bulk_trg_t WHERE TRIM(extra_eq_column8) IN ( SELECT CASE TRIM(extra_eq_column8) WHEN '0' THEN NULL WHEN '1' THEN NULL WHEN '000000000' THEN NULL ELSE TRIM(extra_eq_column8) END FROM report_input_output WHERE requestid = ? AND record_type != 'INPUT' AND accept_reject IN ('SM', 'M') AND TRIM(extra_eq_column8) ~ '^[0-9]{5,10}$' AND NOT TRIM(extra_eq_column8) ~ '^([0-9])\1+$' ) AND cust_unq_id != ? ) AS ucic_subquery UNION ALL SELECT cust_unq_id AS customeruniqueid, 'GROUPID' AS accept_reject FROM mstr_psx_dg_blk_request WHERE TRIM(extra_eq_column8) IN ( SELECT CASE TRIM(extra_eq_column8) WHEN '0' THEN NULL WHEN '1' THEN NULL WHEN '000000000' THEN NULL ELSE TRIM(extra_eq_column8) END FROM report_input_output WHERE requestid = ? AND record_type != 'INPUT' AND accept_reject IN ('SM', 'M') AND TRIM(extra_eq_column8) ~ '^[0-9]{5,10}$' AND NOT TRIM(extra_eq_column8) ~ '^([0-9])\1+$' ) AND cust_unq_id != ? EXCEPT SELECT customeruniqueid, 'GROUPID' AS accept_reject FROM report_input_output WHERE requestid = ? AND record_type != 'INPUT' AND accept_reject = 'NM' UNION ALL SELECT cust_unq_id AS customeruniqueid, 'GROUPID' AS accept_reject FROM psx_cust_dg_bulk_trg_t WHERE TRIM(group_id) IN ( SELECT group_id FROM report_input_output WHERE requestid = ? AND record_type != 'INPUT' AND accept_reject IN ('SM', 'M') AND entitytype = 'FCR' ) AND version = 0 AND feed_sys_id = 'FCR' AND cust_unq_id != ? EXCEPT SELECT customeruniqueid, 'GROUPID' AS accept_reject FROM report_input_output WHERE requestid = ? ) AS subquery GROUP BY subquery.customeruniqueid
insertMatchedPsxIdsIntoTemp=INSERT INTO soa_push_temp ( request_id, matched_cust_unq_id, accept_reject ) WITH matched_records AS ( SELECT DISTINCT customeruniqueid, 'MATCH' AS accept_reject FROM report_input_output WHERE requestid = ? AND record_type != 'INPUT' AND accept_reject IN ('SM', 'M') UNION ALL SELECT cust_unq_id, 'UCIC' as accept_reject FROM ( SELECT cust_unq_id FROM mstr_psx_dg_blk_trg WHERE TRIM(extra_eq_column8) IN ( SELECT CASE WHEN TRIM(extra_eq_column8) IN ('0', '1', '000000000') THEN NULL ELSE TRIM(extra_eq_column8) END as extra_eq_column8 FROM report_input_output WHERE requestid = ? AND record_type != 'INPUT' AND accept_reject IN ('SM', 'M') AND TRIM(extra_eq_column8) ~ '^[0-9]{5,10}$' AND NOT TRIM(extra_eq_column8) ~ '^([0-9])\1+$' ) AND cust_unq_id != ? UNION ALL SELECT cust_unq_id FROM mstr_psx_dg_blk_request WHERE TRIM(extra_eq_column8) IN ( SELECT CASE WHEN TRIM(extra_eq_column8) IN ('0', '1', '000000000') THEN NULL ELSE TRIM(extra_eq_column8) END as extra_eq_column8 FROM report_input_output WHERE requestid = ? AND record_type != 'INPUT' AND accept_reject IN ('SM', 'M') AND TRIM(extra_eq_column8) ~ '^[0-9]{5,10}$' AND NOT TRIM(extra_eq_column8) ~ '^([0-9])\1+$' ) AND cust_unq_id != ? EXCEPT SELECT customeruniqueid FROM report_input_output WHERE requestid = ? AND record_type != 'INPUT' AND accept_reject = 'NM' ) ucic_subquery UNION ALL SELECT cust_unq_id, 'GROUPID' AS accept_reject FROM ( SELECT cust_unq_id FROM mstr_psx_dg_blk_trg WHERE TRIM(group_id) IN ( SELECT group_id FROM report_input_output WHERE requestid = ? AND record_type != 'INPUT' AND accept_reject IN ('SM', 'M') AND entitytype = 'FCR' ) AND feed_sys_id = 'FCR' AND cust_unq_id != ? EXCEPT SELECT customeruniqueid FROM report_input_output WHERE requestid = ? ) groupid_subquery ) SELECT ? as request_id, customeruniqueid, string_agg(accept_reject, ',') AS accept_reject FROM matched_records GROUP BY customeruniqueid
updateClientReportTime=UPDATE REPORT_INPUT_OUTPUT SET CLIENT_REPORT_TIME=current_timestamp,CLIENT_REPORT_STATUS='C'  WHERE RECORD_TYPE='INPUT' AND REQUESTID=?
getMatchedPsxIdsDetails=SELECT ?, substr(?, 1, 8), 'Match', CASE WHEN rpt.entitytype = 'NEG' THEN 'B' WHEN ( rpt.entitytype = 'UBS' OR rpt.entitytype IN ( SELECT data_source_name FROM data_sources WHERE file_type IN ( 'GenericFile' ) ) ) then CASE WHEN rpt.customertype = 'GOOD' THEN 'G' WHEN rpt.customertype = 'BAD' THEN 'B' WHEN rpt.customertype = 'REJECT' THEN 'R' END WHEN rpt.entitytype IN ( select CASE WHEN data_source_name = 'HDB' THEN 'HDO' ELSE data_source_name END FROM md_templates WHERE integration_type IN ( 'TABLE', 'WEBSERVICE', 'QUERY', 'NEW_WEBSERVICE' ) ) THEN 'E' else CASE WHEN rpt.remarks = 'GOOD' THEN 'G' WHEN rpt.remarks = 'BAD' THEN 'B' WHEN rpt.remarks = 'REJECT' THEN 'R' END END lsi_cust_type_c, substr(CAST(rpt.total_amount_due AS varchar), 1, 18) lsi_cust_exposure_n, to_char(current_timestamp, 'YYYY-MM-DD HH24:MI:SS.FF1') AS sas_update_date, ?, substr(rpt.product_code, 1, 8) product_code, CASE WHEN rpt.entitytype = 'VP' THEN 'VISION PLUS' WHEN rpt.entitytype = 'FCR' THEN 'FINWARE' WHEN rpt.entitytype = 'NEG' THEN 'NEGBASE' WHEN rpt.entitytype = 'HDB' THEN 'HDB_FINONE' WHEN rpt.entitytype = 'FN' THEN 'FINNONE' WHEN rpt.entitytype = 'HDO' THEN 'HDB_FINONE' ELSE rpt.entitytype END AS entity_flag, ?, rpt.extra_eq_column4, rpt.custidpart5 AS cust_id_part_5, rpt.extra_eq_column5, rpt.total_amount_due AS tot_amt_due, CASE WHEN rpt.entitytype = 'NEG' THEN 'Bad' WHEN rpt.entitytype IN ( select CASE WHEN data_source_name = 'HDB' THEN 'HDO' ELSE data_source_name END FROM md_templates WHERE integration_type IN ( 'TABLE', 'WEBSERVICE', 'NEW_WEBSERVICE' ) ) THEN 'ENQ' else CASE WHEN rpt.remarks = 'GOOD' THEN 'Good' WHEN rpt.remarks = 'BAD' THEN 'Bad' WHEN rpt.remarks = 'REJECT' THEN 'Reject' ELSE rpt.remarks END END lsi_customer_type_c, to_char(rpt.birthdate, 'MM/DD/YYYY') dob, rpt.days_overline_current AS no_days_overline_curr, rpt.days_overline_ytd AS no_days_overline_ytd, rpt.days_past_due AS dpd, rpt.dedupe_category, rpt.dedupe_date, rpt.delq_amount, rpt.emi, rtrim(rpt.pos_match_reason, ', ,') match_criteria_num, rpt.no_of_months_default, rpt.npi AS npa_stage_id, rpt.overdraftcollateraldetails AS overdraft_collateral_dtl, rpt.overdraftlimitno AS overdraft_limit_no, to_char(rpt.read_date, 'yyyy-mm-dd') read_date, rpt.read_flag, rpt.sas_id, to_char(rpt.sas_update_date, 'yyyy-mm-dd') sas_update_date, rpt.sas_update_status, rpt.status, rpt.tenure, rpt.location_code AS location, CASE WHEN rpt.accept_reject = 'SYSTEM NOMATCH' THEN NULL WHEN rpt.accept_reject IN ( 'SYSTEM MATCH', 'SM' ) THEN 'SYSTEM' WHEN rpt.accept_reject IN ( 'NOMATCH', 'MATCH', 'NM', 'M' ) THEN ( SELECT um.username FROM report_input_output a, um_user um WHERE requestid = ? AND a.verifiedby = um.user_id AND record_type = 'INPUT' ) ELSE NULL END verified_by, substr(rpt.deliquencyreason, 1, 60) delq_string, CASE WHEN rpt.entitytype IN ( 'HBA', 'HLA', 'HLABND', 'HBABND' ) THEN to_char(rpt.approval_date, 'dd/mm/yyyy') ELSE to_char(rpt.disbursement_date, 'dd/mm/yyyy') END disb_date, rpt.block_code1 filler5, rpt.block_code2 filler6, rpt.creditsegmentation filler9, rpt.relationshipnumber filler13, rpt.customernumber filler14, rpt.designation filler17, rpt.sourcecode filler18, rpt.promo_logic filler19, rpt.deviationlevel filler20, rpt.lettersent1 filler23, rpt.pendingstage filler24, rpt.score1 filler25, rpt.hibal filler26, rpt.city2 filler27, rpt.state2 filler28, rpt.zipcode2 filler29, rpt.current_outstanding bal_avail, rpt.date_last_overline filler53, rpt.licenseid driving_licn_no, substr(rpt.extra_name_1, 1, 50) extra_name_1, substr(rpt.extra_eq_column7, 1, 15) extra_eq_column7, rpt.extra_eq_column8, CASE WHEN rpt.entitytype IN ( 'VP' ) THEN CASE WHEN rpt.creditlimit IS NOT NULL THEN rpt.creditlimit ELSE rpt.loanamount END WHEN rpt.entitytype IN ( 'FN', 'PLF', 'NPY', 'FCR', 'HDB', 'NEG', 'HL', 'HLABND' ) THEN rpt.loanamount ELSE rpt.loanamount END loan_amt_applied, rpt.loan_status, rpt.phone2 phone3, rpt.npi npa_stage_id, rpt.extra_eq_column3, rpt.addressline1 addr2, rpt.addressline2 addr3, rpt.city1 city2, rpt.phone1 phone2, rpt.zipcode1 pincode2, rpt.overdraftcollateraldetails cod_collateral_desc, rpt.overdraftlimitno cod_limit_no, rpt.taxid pan, rpt.passportid passport_no, rpt.addressline addr1, rpt.city city1, rpt.state state1, rpt.phone phone1, rpt.zipcode pincode1, rpt.extra_eq_column8, SUM(coalesce(rpt.total_amount_due, 0)) OVER() lsi_total_exposure_n, rpt.voter_id voterid, 'Y', current_timestamp, CASE WHEN rpt.entitytype IN ( 'FN', 'PLF', 'NPY' ) THEN CASE WHEN rpt.extra_eq_column10 IS NOT NULL THEN 'REMARKS~' || rpt.custidpart5 || '|' || rpt.extra_eq_column10 ELSE rpt.custidpart5 END WHEN rpt.entitytype IN ( 'HL' ) THEN CASE WHEN rpt.filler_number_1 IS NULL THEN 'REMARKS~' || rpt.custidpart5 || '|CustId~' || rpt.customerid ELSE 'REMARKS~' || rpt.custidpart5 || '|Disb~' || rpt.filler_number_1 || '|CustId~' || rpt.customerid END WHEN rpt.entitytype IN ( 'HBA', 'HLA', 'HLABND', 'HBABND' ) THEN CASE WHEN rpt.validity_date IS NOT NULL THEN 'REMARKS~' || rpt.custidpart5 || '|Exp~' || rpt.validity_date || '|CustId~' || rpt.customerid ELSE 'REMARKS~' || rpt.custidpart5 || '|Exp~' || '|CustId~' || rpt.customerid END ELSE CASE WHEN rpt.entitytype = 'FCR' THEN CASE WHEN rpt.group_id || rpt.relationship IS NOT NULL THEN CASE WHEN rpt.extra_eq_column10 IS NOT NULL THEN 'REMARKS~' || rpt.remarks || '|' || rpt.group_id || '~' || rpt.relationship || '|' || rpt.extra_eq_column10 ELSE 'REMARKS~' || rpt.remarks || '|' || rpt.group_id || '~' || rpt.relationship END ELSE 'REMARKS~' || rpt.remarks || '|' || rpt.extra_eq_column10 END ELSE CASE WHEN rpt.extra_eq_column10 IS NOT NULL THEN 'REMARKS~' || rpt.remarks || '|' || rpt.extra_eq_column10 ELSE rpt.remarks END END END remarks, CASE WHEN rpt.entitytype = 'VP' then CAST(rpt.extra_eq_column4 AS varchar) WHEN ( rpt.entitytype IN ( 'FN', 'PLF', 'NPY', 'HDB', 'NEG', 'HL', 'HLABND', 'HBABND' ) OR rpt.entitytype IN ( SELECT data_source_name FROM data_sources WHERE file_type IN ( 'GenericFile' ) ) ) THEN rpt.filler_string_4 WHEN rpt.entitytype IN ( 'FW', 'FCR' ) THEN rpt.extra_eq_column7 WHEN rpt.entitytype IN ( 'SME' ) THEN rpt.filler13 ELSE rpt.custidpart2 END matched_app_id, CASE WHEN rpt.entitytype IN ( 'FW', 'FCR', 'VP', 'FN', 'PLF', 'NPY', 'UBS', 'IFM', 'LS', 'MG', 'HL', 'HLABND', 'HBABND' ) THEN substr(rpt.name, 1, 100) ELSE substr(rpt.firstname, 1, 100) END first_name, CASE WHEN rpt.entitytype IN ( 'HDB', 'NEG' ) THEN substr(rpt.middlename, 1, 30) ELSE substr(rpt.middlename, 1, 30) END middle_name, CASE WHEN rpt.entitytype IN ( 'HDB', 'NEG' ) THEN substr(rpt.extra_name_2, 1, 30) ELSE substr(rpt.extra_name_2, 1, 30) END last_name, rpt.current_outstanding bal_avail, rpt.customerid cust_id, rpt.borrower_flag flag1, rpt.extra_eq_column9, rpt.extra_eq_column11, rpt.email1 email_id1, rpt.email email_id2, rpt.constitution, CASE WHEN rpt.record_type = 'PosMatch_ONLINE' THEN to_char(rpt.dg_lchg_time, 'dd-mm-yyyy hh24:mi:ss') ELSE NULL END enquiry_date, CASE WHEN rpt.verifiedby = 0 THEN 'SYS' WHEN rpt.verifiedby = - 1 THEN 'PSX_ROBO' ELSE ( SELECT um.username FROM um_user um WHERE um.user_id = rpt.verifiedby ) END pos_user_id FROM report_input_output rpt WHERE requestid = ? AND record_type IN ( 'PosMatch_ONLINE', 'PosMatch_OFFLINE' ) AND accept_reject IN ( 'SM', 'M' ) UNION ALL SELECT ?, substr(?, 1, 8), 'Match', CASE WHEN a.entity_flag = 'NEG' THEN 'B' WHEN ( a.entity_flag = 'UBS' OR a.entity_flag IN ( SELECT data_source_name FROM data_sources WHERE file_type IN ( 'GenericFile' ) ) ) then CASE a.cust_type_flag WHEN 'GOOD' THEN 'G' WHEN 'BAD' THEN 'B' WHEN 'REJECT' THEN 'R' END WHEN a.entity_flag IN ( select CASE WHEN data_source_name = 'HDB' THEN 'HDO' ELSE data_source_name END FROM md_templates WHERE integration_type IN ( 'TABLE', 'WEBSERVICE', 'QUERY', 'NEW_WEBSERVICE' ) ) THEN 'E' else CASE report.remarks WHEN 'GOOD' THEN 'G' WHEN 'BAD' THEN 'B' WHEN 'REJECT' THEN 'R' END END lsi_cust_type_c, substr(CAST(report.tot_amt_due AS varchar), 1, 18) lsi_cust_exposure_n, to_char(current_timestamp, 'YYYY-MM-DD HH24:MI:SS.FF1') AS sas_update_date, ?, substr(report.product_code, 1, 8) product_code, CASE WHEN a.entity_flag = 'VP' THEN 'VISION PLUS' WHEN a.entity_flag = 'FCR' THEN 'FINWARE' WHEN a.entity_flag = 'NEG' THEN 'NEGBASE' WHEN a.entity_flag = 'HDB' THEN 'HDB_FINONE' WHEN a.entity_flag = 'FN' THEN 'FINNONE' WHEN a.entity_flag = 'HDO' THEN 'HDB_FINONE' ELSE a.entity_flag END AS entity_flag, ?, a.extra_eq_column4, a.cust_id_part_5, a.extra_eq_column5, report.tot_amt_due, CASE WHEN a.entity_flag = 'NEG' THEN 'Bad' WHEN a.entity_flag IN ( select CASE WHEN data_source_name = 'HDB' THEN 'HDO' ELSE data_source_name END FROM md_templates WHERE integration_type IN ( 'TABLE', 'WEBSERVICE', 'NEW_WEBSERVICE' ) ) THEN 'ENQ' else CASE report.remarks WHEN 'GOOD' THEN 'Good' WHEN 'BAD' THEN 'Bad' WHEN 'REJECT' THEN 'Reject' END END lsi_customer_type_c, to_char(a.dob, 'MM/DD/YYYY') dob, report.no_days_overline_curr, report.no_days_overline_ytd, report.dpd, report.dedupe_category, report.dedupe_date, report.delq_amount, report.emi, NULL match_criteria_num, report.no_of_months_default, report.npa_stage_id, report.overdraft_collateral_dtl, report.overdraft_limit_no, to_char(report.read_date, 'yyyy-mm-dd') read_date, report.read_flag, report.sas_id, to_char(report.sas_update_date, 'yyyy-mm-dd') sas_update_date, report.sas_update_status, report.status, report.tenure, report.location, 'SYSTEM' verified_by, substr(report.delq_string, 1, 60) delq_string, CASE WHEN a.feed_sys_id IN ( 'HBA', 'HLA' ) THEN to_char(report.approval_date, 'dd/mm/yyyy') ELSE to_char(report.disb_date, 'dd/mm/yyyy') END disb_date, report.block_code1 filler5, report.block_code2 filler6, report.creditsegmentation filler9, report.relationshipnumber filler13, report.customernumber filler14, report.designation filler17, report.sourcecode filler18, report.promo_logic filler19, report.deviationlevel filler20, report.lettersent1 filler23, report.pendingstage filler24, re